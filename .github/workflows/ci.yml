name: CI

# Heavy work runs here, not on the 8 GB dev machine (master prompt §6/§7).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install → lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-strict)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build can run without secrets.
          # Real values are supplied by Vercel, never committed here.
          NEXT_PUBLIC_STORY_CHAIN_ID: "1315"
          NEXT_PUBLIC_STORY_RPC_URL: "https://aeneid.storyrpc.io"

  evidence-verification:
    name: independently verify the canonical run
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The BUILD 3 check. A harness that grades its own homework proves only that it agrees with
    # itself, so this re-derives the evidence's claims from the chain and from the committed
    # bytes. It runs in OFFLINE mode: read-only eth_getTransactionReceipt / eth_call against
    # Aeneid, no private key, nothing spent. It exits non-zero only on a REFUTED claim — an
    # honest "not verifiable" gap does not fail the build, it is printed.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install (lockfile-strict)
        run: npm ci

      - name: Verify the canonical run against the chain
        run: npm run verify:run

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Build-spec §33: a committed private key is an automatic NO-GO.
      - name: Fail on committed private keys / seed phrases
        run: |
          set -euo pipefail
          echo "Scanning tracked files for secret material..."

          # The two build contracts discuss these patterns BY NAME as things to avoid,
          # so they are excluded from the pattern checks (they contain no real secrets).
          SPEC_DOCS=(
            ':!LICENSEVAULT_BUILD_SPEC.md'
            ':!LICENSEVAULT_DEEPSEEK_MASTER_PROMPT.md'
          )

          # A 0x-prefixed 64-hex private key. Exclude docs, lockfile and evidence.
          #
          # This check fired on `lib/protocol/canonical-vault.ts` on 2026-10-11, and the finding
          # was WRONG in a way worth writing down, because BUILD 3's verifier hit the identical
          # trap: `abi.encode(address)` is exactly 64 hex characters — the same length as a
          # private key — so an ABI-encoded condition blob looks like a key to any regex that
          # counts characters.
          #
          # It is not fixed by excluding the file. That would blind the check to a real key in
          # the one file most likely to hold one. It is fixed by the shape: an ABI-encoded
          # `address` is ALWAYS 12 zero bytes then 20 bytes, i.e. `0x` + 24 zeros + 40 hex. A
          # genuine private key is a scalar in [1, n-1], so 96 leading zero bits has probability
          # about 2^-96 — it cannot happen. The distinction is therefore a property of the data,
          # not a list of files we have decided to trust.
          #
          # Both categories are printed either way, so a reviewer can see what was excluded
          # rather than having to trust that something was.
          #
          # This exclusion is not on trust either: `tests/canonical-vault.test.ts` asserts that
          # `conditionData` decodes to the licence contract and the IP asset, so the excluded
          # blob is proven to be an encoded pair of addresses on every run. If that shape ever
          # stops holding, that test fails and this exclusion loses its basis.
          git grep -nEIo '0x[a-fA-F0-9]{64}' -- . \
              ':!package-lock.json' ':!*.md' ':!evidence/**' > /tmp/hits.txt || true
          grep -E ':0x0{24}[a-fA-F0-9]{40}$' /tmp/hits.txt > /tmp/abi.txt || true
          grep -vE ':0x0{24}[a-fA-F0-9]{40}$' /tmp/hits.txt > /tmp/keys.txt || true

          echo "64-hex occurrences excluded as ABI-encoded addresses (12 zero bytes + 20):"
          sed 's/^/  /' /tmp/abi.txt
          echo "64-hex occurrences treated as key material:"
          sed 's/^/  /' /tmp/keys.txt

          if [ -s /tmp/keys.txt ]; then
            echo "::error::Possible private key found in tracked source (see the second list above)."
            exit 1
          fi

          # Never allow a NEXT_PUBLIC_ private key (build-spec §9.11).
          if git grep -nEI 'NEXT_PUBLIC_[A-Z_]*PRIVATE_KEY' -- . \
              "${SPEC_DOCS[@]}" > /tmp/pub.txt; then
            echo "::error::A private key must never use the NEXT_PUBLIC_ prefix:"
            cat /tmp/pub.txt
            exit 1
          fi

          # .env files must not be tracked.
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example'; then
            echo "::error::A .env file is tracked. Only .env.example may be committed."
            exit 1
          fi

          echo "OK — no secret material found in tracked files."
